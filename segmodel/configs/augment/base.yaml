enabled: true  # 所有增强的总开关, 包含 spot 引导采样.
geometry:
  enabled: true
  rotation_quarter_turns: [0, 1, 2, 3]
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5

stain:
  probability: 0.2
  method: random_preset   # random_preset、preset
  preset: null  # null、standard
  intensity_scale_range: [0.8, 1.2]
  intensity_shift_range: [-0.1, 0.1]
  augment_background: true
  tissue_only: true

brightness:
  probability: 0.2
  multiplier_range: [0.8, 1.2]
  tissue_only: true

contrast:
  probability: 0.2
  factor_range: [0.8, 1.2]
  tissue_only: true

low_resolution:
  probability: 0.2
  scale_range: [0.5, 1.0]
  tissue_only: false

pfm_mask:
  probability: 0.0
  min_count: 1
  max_count: null

sampling:
  spot_sampling_fraction: 0.25
