image:
  backbone_init: convnext  # convnext: 骨干截断正态 std=0.02; pytorch: 原初始化
  top_k: 2
  encoder_chans: [32, 64, 128, 256]
  decoder_chans: [128, 64, 32]
  downsample_factor: 2  # 相邻编码层缩小 2 倍，解码层同步放大 2 倍
  global_dim: 128
  spatial_dim: 64
  # 每个值控制整个 stage 的 spatial 调制，global 调制始终保留。
  encoder_spatial: [false, false, true, true]  # 依次为 2、4、8、16 mpp
  decoder_spatial: [true, false, false]  # 依次为 8、4、2 mpp
  skip_drop_path: 0.1
  drop_path: [0.1, 0.1, 0.1, 0.1]
  tissue_state_count: 32  # 随机模板数量，即状态数 K；至少为 2
