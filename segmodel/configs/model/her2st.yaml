defaults:
  - base
  - _self_

# MoMu 输出 F 后预测共享软状态；表达模板初始化由 training.image.template_init 控制。
image:
  output_scale: 1  # Stem 3×3、stride=1，只变换通道；MoMu 原生输出 1 mpp
  gradient_checkpointing: true  # 重算 ConvNeXt block、解码融合和状态头的激活
  tissue_state_count: 64  # 共享软状态数 K，至少为 2
  tissue_state_dim: 32  # 单层 1×1 状态编码器输出通道数，不是状态数
