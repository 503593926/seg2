defaults:
  - base
  - _self_

spot_diameter_um: 100.0
data_root: 'data/her2st/1mpp'
patient_names: [A, B, C, D, E, F, G, H]  # 患者留出顺序；填写患者名，不填写切片名
split_mode: patient_loocv

gene_expression_dir: gene_expression/patient_loocv

image_feature_maps:
  - 'feature_ho1/tile_224_mpp_1_resize_1_overlap_1'
  - 'feature_uni2/tile_224_mpp_1_resize_1_overlap_1'
  - 'feature_virchow2/tile_224_mpp_1_resize_1_overlap_1'

pseudo_label_dir: 'pseudo_label_ratio@100'

# 有标注和仅表达切片按组混合采样。
labeled_sampling_fraction: null
crop_size: 896
inference_batch_size: 8  # 1 mpp 解码限制每次窗口数
samples_per_epoch: 2000
min_valid_fraction: 0.25

num_workers: 8
prefetch_factor: 1  # 大特征 batch 限制预取，避免共享内存和锁页副本堆积
pin_memory: false  # WSL 下优先降低主机内存压力；仍使用 GPU/BF16 训练
