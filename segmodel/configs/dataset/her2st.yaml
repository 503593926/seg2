defaults:
  - base
  - _self_

data_root: 'data/her2st/1mpp'
all_names: ['E1', 'F1', 'G2', 'A1', 'C1', 'D1', 'H1', 'B1',]
split_mode: patient_loocv

# all_names 的 8 张标注切片决定评估 fold，表达监督覆盖全部 36 张切片。
expression_names:
  - A1
  - A2
  - A3
  - A4
  - A5
  - A6
  - B1
  - B2
  - B3
  - B4
  - B5
  - B6
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  - D1
  - D2
  - D3
  - D4
  - D5
  - D6
  - E1
  - E2
  - E3
  - F1
  - F2
  - F3
  - G1
  - G2
  - G3
  - H1
  - H2
  - H3

gene_expression_dir: gene_expression/task1_patient_loocv
# 有标注和仅表达切片按组混合采样。
labeled_sampling_fraction: null

spot_diameter_um: 100.0

image_feature_maps:
#  - 'feature_ho0/tile_224_mpp_1_resize_1_overlap_1_cls_overlap_1'
  - 'feature_ho1/tile_224_mpp_1_resize_1_overlap_1_cls_overlap_1'
  - 'feature_uni2/tile_224_mpp_1_resize_1_overlap_1_cls_overlap_1'
#  - 'feature_virchow/tile_224_mpp_1_resize_1_overlap_1_cls_overlap_1'
  - 'feature_virchow2/tile_224_mpp_1_resize_1_overlap_1_cls_overlap_1'

pseudo_label_dir: 'pseudo_label_ratio@100'

crop_size: 896
inference_batch_size: 8
samples_per_epoch: 4000
min_valid_fraction: 0.25

num_workers: 8
prefetch_factor: 1  # 大特征 batch 限制预取，避免共享内存和锁页副本堆积
pin_memory: false  # WSL 下优先降低主机内存压力；仍使用 GPU/BF16 训练
