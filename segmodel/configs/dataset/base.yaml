split_mode: patient_loocv  # patient_loocv | transfer
patient_names: []
labeled_sampling_fraction: null
slides_per_batch: null  # null 保留独立随机采样；整数指定每个完整训练 batch 的不同切片数，需整除 batch_size
data_root: ""
ref_dataset: ""
tgt_dataset: ""
gene_expression_file: '${.ref_dataset}_to_${.tgt_dataset}.h5ad'
num_workers: 4
persistent_workers: true
prefetch_factor: 2
pin_memory: true  # 锁页拷贝开关；WSL 的大 batch 可关闭以降低主机内存压力
inference_batch_size: 1
