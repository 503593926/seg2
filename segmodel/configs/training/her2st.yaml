defaults:
  - base
  - _self_

image:
  batch_size: 16  # 1 mpp 状态图较大；保持 896 μm 的 crop 物理视野
  accumulate_grad_batches: 1  # 每个优化器 step 累积的 batch 数
  loss_weights:
    segmentation: 0.5  # 使用整片动态传播缓存的伪标签
    gene_prediction: 1.0
    gene_correlation: 1.0
    state_balance: 0.1  # 仅惩罚低于 alpha/K 的组织状态用量；0 关闭，包含仅有表达的切片
