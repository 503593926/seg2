vae:
  pretrain_lr: 0.001
  weight_decay: 0.01
  pretrain_epochs: 50
  pretrain_batch_size: 128
  rec_loss: 1.0
  kl_weight: 0.1

image:
  epochs: 60
  warmup_epochs: 10
  val_every_n_epochs: 1   # 每 N 个 epoch 验证一次（指标 + validation/ 可视化）；epochs 不被 N 整除时末尾无验证
  batch_size: 16
  ema_decay: 0.999

  lr: 4e-3
  weight_decay: 0.05
  loss_weights:
    segmentation: 0.0
    affinity: 0.0
    superpixel: 0.0
    molecular: 0.0
    relation: 0.0  # crop 内 spot 余弦相似度关系蒸馏
    propagation: 1.0  # 可微传播软标签项, 与 experiment.propagation.enabled 配合
    propagation_query: 0.0  # 隐藏 spot 类别真值监督传播
    gene_auxiliary: 0.0  # 普通图像→表达辅助预测对照
    gene_propagation: 0.0  # 真实表达监督同一套传播边权
    gene_prediction: 0.0  # 纯图像稠密表达预测, 所有有效训练 spot 监督

    pfm_cls_global: 0.0
    pfm_orth_global: 0.0
    pfm_cls_spatial: 0.0
    pfm_orth_spatial: 0.0

runtime:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
