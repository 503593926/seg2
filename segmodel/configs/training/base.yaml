image:
  epochs: 10
  warmup_steps: 0.2  # 预热占总优化器 step 的比例 [0, 1]，向上取整；0 表示不预热
  progress_every_n_steps: 1  # 进度条指标刷新间隔，按优化器更新计数；首步和每轮末尾也刷新
  val_every_n_epochs: 1   # 每 N 个 epoch 验证一次（指标 + validation/ 可视化）；epochs 不被 N 整除时末尾无验证
  gene_visualization_top_n: 1  # 每轮验证后保存 pooled PCC 最高的 N 个基因的归一化 spot/dense 对照图；0 关闭
  batch_size: 8
  expression_transform: log1p  # 线性表达先做 spot 均值，再 log1p 计算 MSE/PCC
  gene_correlation_min_spots: 8  # 当前 batch 内每个 slide 合并后至少包含这些有效 spot，最低按 3 个处理
  gene_correlation_std_floor: 0.02  # 相关性两侧标准差的软下限，单位为 log1p 表达标准差
  ema_decay: 0.999
  state_balance_alpha: 0.5  # 每个状态最低用量为 alpha / K，取值 (0, 1]

  lr: 4e-3
  weight_decay: 0.05
  loss_weights:
    segmentation: 0.0
    gene_prediction: 1.0  # 纯图像稠密表达预测, 所有有效训练 spot 监督
    gene_correlation: 0.5  # 按 slide 去均值后的 batch 正则化相关性损失，与 MSE 独立加权
    state_balance: 0.0  # 最低用量损失 mean(relu(log(alpha/K) - log(q)))；0 关闭
    template_orthogonal: 0.0  # 模板两两去相关（log 空间余弦平方均值）；0 关闭
    template_entropy: 0.0  # 模板熵（nats）；正权重压熵更稀疏，负权重抬熵更弥散；0 关闭

runtime:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
