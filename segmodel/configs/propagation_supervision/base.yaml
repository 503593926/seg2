enabled: false
query_fraction: 0.25
# 分割拟合固定的当前软目标; 边权由隐藏 spot 真值独立校准。
detach_pseudo_target: true
gene_mode: none  # none | auxiliary | propagation | prediction
expression_transform: log1p  # CP10k + log1p; 区域聚合在 expm1 后的线性空间完成
gene_smoothing: 1.0
gene_ridge: 0.001
gene_steps: 85
gene_tolerance: 1e-6
shuffle_genes: false
# prediction 模式: 预测表达对类别 RW 边权的有界调制。
gene_edge_strength: 0.3  # 0 为同一稠密表达头的无调制对照; 0.3 对应 [0.7, 1.3]
gene_edge_beta: 1.0
detach_gene_edges: false  # true: 切断类别 query 损失到表达头的路径
