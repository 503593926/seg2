# 在IDE直接运行 derive/prepare_her2st_patient.py 即可, 无需命令行参数。
raw_data_root: /home/yfm/data/bioinfo/her2st-master/data

# 空列表表示准备 derive/dataset.yaml 中8张标注切片对应的全部患者fold。
# 只先验证C患者时可改成 [C1]。
evaluation_names: []

# 图像、坐标和label-MPP tissue先准备; 然后执行以下可选阶段。
prepare_genes: true
prepare_features: true
feature_models: [ho1, uni2, virchow2, ho0, virchow]
feature_batch_size: 256
feature_device: cuda
# 已有图像和特征直接复用, 不覆盖原来8张切片的数据。
skip_existing: true
