dataset: her2st
radio: 1.0

datasets:
  her2st:
    patient_names: [A, B, C, D, E, F, G, H]
    # 分割监督和评估使用的切片；表达切片从预处理目录自动发现。
    labeled_names: [A1, B1, C1, D1, E1, F1, G2, H1]
    spot_diameter_um: 100.0
    gene:
      selection_mode: svgs  # 可选：hvgs、svgs、hegs、union（union = top-k SVG ∪ top-k HVG）
      n_top_genes: 512
      union_rank_and_truncate: false  # union 模式排序截取；false 则保留完整并集
      target_sum: 10000.0
      svg_n_neighbors: 8
