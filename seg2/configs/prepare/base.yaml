resolution:
  label_mpp: 2.0
  tile_size: 224

snic:
  superpixel_size_um: 64.0
  compactness: 10.0

rw:
  beta: 1.0
  non_cancer_threshold: 0.2
  cancer_threshold: 0.8
  max_snap_distance_um: 100.0
  pseudo_label_ratio: 1.0

seeds:
  ratios: [1.0]
  seed: 0

gene:
  mapping_reference: ${paths.data_root}/reference/hgnc_complete_set.txt

features:
  extractors: [h_optimus_1, uni2, virchow2]
  batch_size: 256
  device: cuda
  resize: true
  overlap_average: true
  overlap_cls: false
