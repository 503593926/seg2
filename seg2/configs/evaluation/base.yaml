inference:
  crop_size: 896
  stride: null
  batch_size: 8
  device: cuda:0
  precision: bf16-mixed
  expression_transform: ${training.image.expression_transform}
  threshold: 0.5

validation:
  enabled: true
  every_n_epochs: 1
  weights: ema
  top_genes: 0

test:
  after_train: false
  weights: ema
  top_genes: 0
  region_classification: false
