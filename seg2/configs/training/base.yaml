image:
  epochs: 10
  warmup_steps: 0.15
  progress_every_n_steps: 1
  batch_size: 8
  expression_transform: log1p
  gene_correlation_min_spots: 8
  gene_correlation_std_floor: 0.02
  ema_decay: 0.999
  state_balance_alpha: 0.5

  lr: 4e-3
  weight_decay: 0.05
  loss_weights:
    segmentation: 0.0
    gene_prediction: 1.0
    gene_correlation: 0.5
    state_balance: 0.0
    template_orthogonal: 0.0
    template_entropy: 0.0

runtime:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
